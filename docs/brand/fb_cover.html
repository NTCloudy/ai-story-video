<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head>
<body>
<!-- Facebook cover 1640x924: phones show the whole image, desktop shows the middle 1640x624 band,
     so all text sits inside that band. Artwork reused from banner.html. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="924" viewBox="0 0 1640 924">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1033"/>
      <stop offset="0.45" stop-color="#2a0f6b"/>
      <stop offset="1" stop-color="#05041a"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".75"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".55"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".45"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde047"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fdba74"/><stop offset="0.6" stop-color="#ea580c"/><stop offset="1" stop-color="#7c2d12"/>
    </radialGradient>
    <radialGradient id="earth" cx="35%" cy="35%" r="75%">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="0.6" stop-color="#0284c7"/><stop offset="1" stop-color="#0c4a6e"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tglow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#a855f7" flood-opacity=".9"/>
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1640" height="924" fill="url(#sky)"/>
  <ellipse cx="420" cy="380" rx="620" ry="360" fill="url(#nebula1)"/>
  <ellipse cx="1300" cy="600" rx="560" ry="330" fill="url(#nebula2)"/>
  <ellipse cx="880" cy="190" rx="480" ry="200" fill="url(#nebula3)"/>
  <g fill="#fff" filter="url(#glow)" id="stars"></g>
  <g filter="url(#shadow)">
    <circle cx="70" cy="110" r="95" fill="url(#planet)"/>
    <ellipse cx="70" cy="110" rx="140" ry="32" fill="none" stroke="#fde047" stroke-width="10" transform="rotate(-20 70 110)" opacity=".9"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="1585" cy="830" r="85" fill="url(#earth)"/>
    <path d="M1540 805 q20 -20 45 -8 q18 9 35 -3 q8 18 -8 30 q-22 13 -40 0 q-18 -9 -32 -19z" fill="#22c55e"/>
  </g>
  <g transform="translate(-332.0 -185.6) scale(0.9)">
  <!-- mascot -->
  <g transform="translate(560 560) scale(0.62)" filter="url(#shadow)">
    <path d="M90 300 C30 300 5 250 20 210 C35 165 85 148 122 165 C130 90 200 45 270 58 C325 68 365 110 374 160
             C420 140 485 165 495 225 C505 280 465 320 415 320 L115 320 C105 320 98 312 90 300Z" fill="url(#cloud)"/>
    <ellipse cx="200" cy="222" rx="30" ry="38" fill="#1e1b4b"/><ellipse cx="320" cy="222" rx="30" ry="38" fill="#1e1b4b"/>
    <circle cx="211" cy="208" r="11" fill="#fff"/><circle cx="331" cy="208" r="11" fill="#fff"/>
    <ellipse cx="158" cy="270" rx="22" ry="12" fill="#fb7185" opacity=".55"/><ellipse cx="362" cy="270" rx="22" ry="12" fill="#fb7185" opacity=".55"/>
    <path d="M230 270 Q260 302 290 270" stroke="#1e1b4b" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="910" y="700" font-family="Arial Black, Impact, sans-serif" font-size="128" font-weight="900"
        fill="url(#title)" filter="url(#tglow)" letter-spacing="2">CLOUD FINDS</text>
  <text x="910" y="826" font-family="Arial Black, Impact, sans-serif" font-size="128" font-weight="900"
        fill="url(#title)" filter="url(#tglow)" letter-spacing="2">THE WORLD</text>

  <!-- tagline pill -->
  <g>
    <rect x="910" y="852" width="1110" height="66" rx="33" fill="#fde047"/>
    <text x="1465" y="896" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="29" fill="#1e1b4b">MIND-BLOWING SCIENCE &amp; WHAT-IFS  •  NEW SHORT DAILY</text>
  </g>

  <!-- topic chips above title -->
  <g font-family="Arial Black, sans-serif" font-size="26" fill="#fff">
    <rect x="910" y="545" width="190" height="50" rx="25" fill="#ffffff22" stroke="#ffffff66"/>
    <text x="1005.0" y="579" text-anchor="middle">🚀 SPACE</text>
    <rect x="1114" y="545" width="190" height="50" rx="25" fill="#ffffff22" stroke="#ffffff66"/>
    <text x="1209.0" y="579" text-anchor="middle">🧠 BRAIN</text>
    <rect x="1318" y="545" width="180" height="50" rx="25" fill="#ffffff22" stroke="#ffffff66"/>
    <text x="1408.0" y="579" text-anchor="middle">🫀 BODY</text>
    <rect x="1512" y="545" width="225" height="50" rx="25" fill="#ffffff22" stroke="#ffffff66"/>
    <text x="1624.5" y="579" text-anchor="middle">🏛️ HISTORY</text>
    <rect x="1751" y="545" width="215" height="50" rx="25" fill="#ffffff22" stroke="#ffffff66"/>
    <text x="1858.5" y="579" text-anchor="middle">❓ WHAT IF</text>
  </g>

  </g>
</svg>
<script>
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const g = document.getElementById("stars");
  for (let i = 0; i < 170; i++) {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", (rnd() * 1640).toFixed(1)); c.setAttribute("cy", (rnd() * 924).toFixed(1));
    c.setAttribute("r", (rnd() * 2.4 + 0.6).toFixed(2)); c.setAttribute("opacity", (rnd() * 0.7 + 0.3).toFixed(2));
    g.appendChild(c);
  }
</script>
</body></html>
