name: YouTube Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests PyYAML
      - name: 檢查 YouTube 授權、上傳權限與已上傳影片
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python -m storyvideo.youtube check
          python - <<'PY'
          import json, requests
          from storyvideo import youtube
          ids = ",".join(h["video_id"] for h in json.load(open("channel/history.json")) if h.get("video_id"))
          r = requests.get(f"{youtube.API}/videos", params={"part": "snippet,status,processingDetails,contentDetails", "id": ids},
                           headers={"Authorization": f"Bearer {youtube.access_token()}"}, timeout=30).json()
          for v in r.get("items", []):
              print("VIDEO", v["id"], v["snippet"]["channelId"], v["status"]["privacyStatus"], v["status"]["uploadStatus"],
                    v["status"].get("rejectionReason", ""), v["snippet"]["title"],
                    "| kids:", v["status"].get("madeForKids"), "| rating:", json.dumps(v.get("contentDetails", {}).get("contentRating", {})),
                    "| region:", json.dumps(v.get("contentDetails", {}).get("regionRestriction", {})),
                    "| synthetic:", v["status"].get("containsSyntheticMedia"), "| dur:", v.get("contentDetails", {}).get("duration"))
          print("FOUND", len(r.get("items", [])), "of", len(ids.split(",")))
          PY
