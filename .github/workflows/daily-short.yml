name: Daily Short

run-name: "📱 Daily Short ${{ inputs.topic && format('— {0}', inputs.topic) || '' }} [${{ inputs.request_id || 'auto' }}]"

# GitHub starts scheduled runs late (we measured 4-7 hours), so a single "08:23" cron used to land around
# 02:00 the next night. Instead we fire every hour from the Taiwan evening onwards: runs that land before
# channel.yaml `publish_after` (07:30 Taiwan) skip themselves, the first one after it makes the day's Short,
# and every later one skips because today's Short already exists (see channel/history.json).
on:
  schedule:
    - cron: "23 14-23 * * *"   # 22:23-07:23 Taiwan (they arrive hours later)
    - cron: "23 0-6 * * *"     # 08:23-14:23 Taiwan (fallbacks)
    - cron: "23 9,12 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "指定主題（留空 = 用排程清單或讓 AI 選）"
        required: false
        type: string
      concept:
        description: "（選填）主題的核心概念，1-4 個英文字，例如 hairy frog claws"
        required: false
        type: string
      force:
        description: "今天已經做過也再做一支"
        type: boolean
        default: false
      upload:
        description: "上傳到 YouTube"
        type: boolean
        default: true
      request_id:
        required: false
        type: string
        default: manual
      test_placeholder:
        description: "（測試用）插畫額度用完時用預設背景"
        type: boolean
        default: false
      dry_run:
        description: "（測試用）只產生影片給我看：不上傳、不發 FB/IG、不寫頻道紀錄"
        type: boolean
        default: false

concurrency:
  group: daily-short
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # "today's Short could not be made" notices (GitHub emails you about new issues)

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # a scheduled run may wait up to ~5.5 h for publish_after (see below)
    steps:
      - name: 準備環境
        uses: actions/checkout@v4

      # GitHub only starts a handful of the hourly scheduled runs each day, at random times. A scheduled run
      # that lands in the early morning therefore waits here until publish_after (07:30 Taiwan) instead of
      # skipping, so the day's Short goes out on time even when no run happens to land after 07:30.
      - name: 等到發片時間（排程提早到的話）
        if: github.event_name == 'schedule'
        timeout-minutes: 340
        run: |
          WAIT=$(python3 - <<'PY'
          import json, re
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Taipei"))
          cfg = open("channel/channel.yaml", encoding="utf-8").read()
          m = re.search(r'^publish_after:\s*"?(\d{1,2}):(\d{2})', cfg, re.M)
          h, mi = (int(m.group(1)), int(m.group(2))) if m else (7, 30)
          target = now.replace(hour=h, minute=mi, second=0, microsecond=0)
          done = any(e.get("date") == now.date().isoformat() for e in json.load(open("channel/history.json")))
          wait = (target - now).total_seconds()
          print(int(wait) if not done and 0 < wait <= 5.5 * 3600 else 0)
          PY
          )
          if [ "$WAIT" -gt 0 ]; then
            echo "排程提早到了，等 $((WAIT / 60)) 分鐘到發片時間"
            sleep "$WAIT"
            git pull -q --rebase   # a manual run may have made today's Short meanwhile
          fi

      # The runner's Ubuntu package mirror sometimes hangs for the whole timeout, so the packages are restored
      # from the GitHub Actions cache; apt is only used when the cache is missing.
      - name: 安裝工具（ffmpeg、字型，從快取還原）
        id: aptcache
        continue-on-error: true
        timeout-minutes: 10
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg fonts-noto-cjk
          version: "1.1"

      - name: 安裝工具（快取沒有的話改用 apt）
        timeout-minutes: 20
        run: |
          # the apt cache can restore the binaries without all of their shared libraries (exit 127),
          # so actually run them instead of only checking that they exist
          if ffmpeg -hide_banner -version >/dev/null 2>&1 && ffprobe -hide_banner -version >/dev/null 2>&1 \
             && fc-list | grep -q "Noto Sans CJK"; then
            echo "ffmpeg 和字型已就緒"; exit 0
          fi
          echo "::warning::快取還原的 ffmpeg 無法執行，改用 apt 重新安裝"
          ffprobe -hide_banner -version 2>&1 | head -3 || true
          for i in 1 2 3; do sudo timeout 240 apt-get update -qq -o Acquire::Retries=3 && break; sleep 20; done
          for i in 1 2 3; do
            sudo timeout 300 apt-get install -y -qq --reinstall -o Acquire::Retries=3 ffmpeg fonts-noto-cjk >/dev/null && break
            sleep 20
          done
          ffmpeg -hide_banner -version >/dev/null && ffprobe -hide_banner -version >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 快取景深模型（免費動態效果用）
        uses: actions/cache@v4
        with:
          path: ~/.cache/storyvideo
          key: depth-anything-v2-small-onnx-v1

      - name: AI 製作 Short（選題 → 查證 → 腳本 → 插畫 → 配音 → 合成 → 上傳）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          CONCEPT: ${{ inputs.concept }}
          FORCE: ${{ inputs.force }}
          UPLOAD: ${{ inputs.upload }}
          ALLOW_PLACEHOLDER: ${{ inputs.test_placeholder && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$TOPIC" ] && args+=(--topic "$TOPIC")
          [ -n "$CONCEPT" ] && args+=(--concept "$CONCEPT")
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$UPLOAD" = "false" ] && args+=(--no-upload)
          python -m storyvideo.daily "${args[@]}" --out out

      - name: 發布影片
        if: hashFiles('out/video.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -c "import json;print(json.load(open('out/meta.json'))['title'])")
          [ "${{ inputs.dry_run }}" = "true" ] && TITLE="🧪 測試（未上傳）$TITLE"
          TAG="short-$(date -u +%Y%m%d-%H%M%S)"
          python - <<'EOF' > notes.md
          import json
          m = json.load(open("out/meta.json"))
          vid = m.get("video_id")
          print(f"**長度** {m['duration']} 秒｜**主題** {m['topic']}｜**系列** {m.get('series','')}\n")
          if vid:
              print(f"**YouTube**：https://youtube.com/shorts/{vid}（{m.get('privacy')}）｜[在 Studio 編輯](https://studio.youtube.com/video/{vid}/edit)\n")
          print(f"### YouTube 標題\n{m['title']}\n")
          print(f"### YouTube 說明\n{m['youtube_description']}\n")
          print(f"### 標籤\n{', '.join(m['tags'])}")
          EOF
          gh release create "$TAG" --title "$TITLE" --notes-file notes.md \
            out/video.mp4 out/thumbnail.jpg out/subtitles.srt out/youtube.txt out/script.json out/meta.json \
            $( [ -f out/assets.zip ] && echo out/assets.zip )
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: 同步到 Facebook / Instagram（Reels）
        # scheduled runs always post; manual runs only when uploading for real (GitHub coerces null == false)
        if: hashFiles('out/video.mp4') != '' && (github.event_name == 'schedule' || (inputs.upload && !inputs.dry_run))
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          COVER=""; VIDEO_URL=""
          if [ -n "$RELEASE_TAG" ]; then
            BASE="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
            COVER="$BASE/thumbnail.jpg"; VIDEO_URL="$BASE/video.mp4"
          fi
          python -m storyvideo.meta post --video out/video.mp4 --meta out/meta.json --thumb out/thumbnail.jpg \
            --cover-url "$COVER" --video-url "$VIDEO_URL"

      - name: 補發先前沒同步到 FB / IG 的影片
        if: always()
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python -m storyvideo.meta catchup --repo "${{ github.repository }}"

      - name: 通知：今天的 Short 沒做出來
        if: hashFiles('out/GAVE_UP') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY=$(TZ=Asia/Taipei date +%F)
          TITLE="⚠️ $DAY 的 Short 沒做出來"
          BODY="$(cat out/GAVE_UP)

          執行紀錄：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then gh issue comment "$NUM" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi

      - name: 更新頻道紀錄
        if: always()
        run: |
          MSG="📱 Daily Short update"
          [ -f out/meta.json ] && MSG="📱 Daily Short: $(python -c "import json;print(json.load(open('out/meta.json'))['topic'][:60])")"
          python -m storyvideo.channel_sync --base "${{ github.sha }}" --message "$MSG"
