name: Daily Short

run-name: "📱 Daily Short ${{ inputs.topic && format('— {0}', inputs.topic) || '' }} [${{ inputs.request_id || 'auto' }}]"

# GitHub cron is best-effort, so we try several times a day; the job skips itself
# once today's Short exists (see channel/history.json).
on:
  schedule:
    - cron: "23 0 * * *"    # 08:23 Taiwan
    - cron: "23 4 * * *"
    - cron: "23 8 * * *"
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "指定主題（留空 = 用排程清單或讓 AI 選）"
        required: false
        type: string
      force:
        description: "今天已經做過也再做一支"
        type: boolean
        default: false
      upload:
        description: "上傳到 YouTube"
        type: boolean
        default: true
      request_id:
        required: false
        type: string
        default: manual
      test_placeholder:
        description: "（測試用）插畫額度用完時用預設背景"
        type: boolean
        default: false

concurrency:
  group: daily-short
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 準備環境
        uses: actions/checkout@v4

      - name: 安裝工具（ffmpeg、字型）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: AI 製作 Short（選題 → 查證 → 腳本 → 插畫 → 配音 → 合成 → 上傳）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          FORCE: ${{ inputs.force }}
          UPLOAD: ${{ inputs.upload }}
          ALLOW_PLACEHOLDER: ${{ inputs.test_placeholder && '1' || '' }}
        run: |
          args=()
          [ -n "$TOPIC" ] && args+=(--topic "$TOPIC")
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$UPLOAD" = "false" ] && args+=(--no-upload)
          python -m storyvideo.daily "${args[@]}" --out out

      - name: 發布影片
        if: hashFiles('out/video.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -c "import json;print(json.load(open('out/meta.json'))['title'])")
          TAG="short-$(date -u +%Y%m%d-%H%M%S)"
          python - <<'EOF' > notes.md
          import json
          m = json.load(open("out/meta.json"))
          vid = m.get("video_id")
          print(f"**長度** {m['duration']} 秒｜**主題** {m['topic']}｜**系列** {m.get('series','')}\n")
          if vid:
              print(f"**YouTube**：https://youtube.com/shorts/{vid}（{m.get('privacy')}）｜[在 Studio 編輯](https://studio.youtube.com/video/{vid}/edit)\n")
          print(f"### YouTube 標題\n{m['title']}\n")
          print(f"### YouTube 說明\n{m['youtube_description']}\n")
          print(f"### 標籤\n{', '.join(m['tags'])}")
          EOF
          gh release create "$TAG" --title "$TITLE" --notes-file notes.md \
            out/video.mp4 out/thumbnail.jpg out/subtitles.srt out/youtube.txt out/script.json out/meta.json
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: 同步到 Facebook / Instagram（Reels）
        if: hashFiles('out/video.mp4') != ''
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          COVER=""; VIDEO_URL=""
          if [ -n "$RELEASE_TAG" ]; then
            BASE="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
            COVER="$BASE/thumbnail.jpg"; VIDEO_URL="$BASE/video.mp4"
          fi
          python -m storyvideo.meta post --video out/video.mp4 --meta out/meta.json --thumb out/thumbnail.jpg \
            --cover-url "$COVER" --video-url "$VIDEO_URL"

      - name: 補發先前沒同步到 FB / IG 的影片
        if: always()
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python -m storyvideo.meta catchup --repo "${{ github.repository }}"

      - name: 更新頻道紀錄
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add channel/history.json channel/queue.json channel/trends.json 2>/dev/null || git add channel/history.json channel/queue.json
          MSG="📱 Daily Short update"
          [ -f out/meta.json ] && MSG="📱 Daily Short: $(python -c "import json;print(json.load(open('out/meta.json'))['topic'][:60])")"
          git commit -m "$MSG" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
